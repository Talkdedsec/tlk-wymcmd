name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check translations
        shell: pwsh
        run: ./scripts/i18n-check.ps1

      - name: Build
        run: dotnet build src/Wymcmd/Wymcmd.csproj -c Release --warnaserror

      - name: Publish single file
        run: dotnet publish src/Wymcmd/Wymcmd.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: wymcmd
          path: publish/wymcmd.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/wymcmd.exe
