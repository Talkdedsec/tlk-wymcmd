name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check translations
        shell: pwsh
        run: ./scripts/i18n-check.ps1

      - name: Build
        run: dotnet build src/Wymcmd/Wymcmd.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test src/Wymcmd.Tests/Wymcmd.Tests.csproj -c Release --logger "console;verbosity=minimal"

      - name: Publish single file
        run: dotnet publish src/Wymcmd/Wymcmd.csproj -c Release -o publish

      - name: Publish for ARM64
        shell: pwsh
        run: |
          # Built from the same source, but no ARM machine runs the test suite: shipped as is.
          dotnet publish src/Wymcmd/Wymcmd.csproj -c Release -r win-arm64 -o publish-arm64
          dotnet publish src/WymcmdShim/WymcmdShim.csproj -c Release -r win-arm64 -o launcher-arm64
          Copy-Item launcher-arm64/wymcmd-launcher.exe publish-arm64/wymcmd.com

      - name: Publish console launcher
        shell: pwsh
        run: |
          dotnet publish src/WymcmdShim/WymcmdShim.csproj -c Release -o launcher
          Copy-Item launcher/wymcmd-launcher.exe publish/wymcmd.com

      - name: Smoke test
        shell: pwsh
        run: |
          # Always through the launcher: the windowed executable does not block a shell,
          # which is exactly the behaviour the launcher exists to fix.
          $wymcmd = "publish/wymcmd.com"

          $version = & $wymcmd --version
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }
          if ($version -notmatch '^wymcmd \d+\.\d+\.\d+$') { throw "unexpected version output: $version" }

          & $wymcmd help --lang en | Out-Null
          & $wymcmd help --lang tr | Out-Null

          # doctor reports missing sources on a bare runner, which is exit code 3
          & $wymcmd doctor --lang en
          if ($LASTEXITCODE -notin @(0, 3)) { throw "doctor returned $LASTEXITCODE" }

          # doctor legitimately exits 3 here (a bare runner has most sources off), and the shell
          # would carry that straight into the step result.
          exit 0

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item publish/wymcmd.exe, publish/wymcmd.com package/
          Copy-Item README.md, README.tr.md, LICENSE, CHANGELOG.md package/
          Compress-Archive -Path package/* -DestinationPath "wymcmd-$version-win-x64.zip"

          New-Item -ItemType Directory -Path package-arm64 | Out-Null
          Copy-Item publish-arm64/wymcmd.exe, publish-arm64/wymcmd.com package-arm64/
          Copy-Item README.md, README.tr.md, LICENSE, CHANGELOG.md package-arm64/
          Compress-Archive -Path package-arm64/* -DestinationPath "wymcmd-$version-win-arm64.zip"
          $armHash = (Get-FileHash "wymcmd-$version-win-arm64.zip" -Algorithm SHA256).Hash
          "$armHash  wymcmd-$version-win-arm64.zip" | Out-File "wymcmd-$version-win-arm64.zip.sha256" -Encoding ascii
          $hash = (Get-FileHash "wymcmd-$version-win-x64.zip" -Algorithm SHA256).Hash
          "$hash  wymcmd-$version-win-x64.zip" | Out-File "wymcmd-$version-win-x64.zip.sha256" -Encoding ascii
          $exeHash = (Get-FileHash publish/wymcmd.exe -Algorithm SHA256).Hash
          "$exeHash  wymcmd.exe" | Out-File "wymcmd.exe.sha256" -Encoding ascii
          Write-Host "zip:  $hash"
          Write-Host "exe:  $exeHash"

      - uses: actions/upload-artifact@v7
        with:
          name: wymcmd
          path: |
            publish/wymcmd.exe
            publish/wymcmd.com
            wymcmd-*.zip
            *.sha256

      - name: Provenance for the published binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            publish/wymcmd.exe
            publish/wymcmd.com
            wymcmd-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: false
          files: |
            publish/wymcmd.exe
            publish/wymcmd.com
            wymcmd-*.zip
            *.sha256
