name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check translations
        shell: pwsh
        run: ./scripts/i18n-check.ps1

      - name: Build
        run: dotnet build src/Wymcmd/Wymcmd.csproj -c Release -warnaserror

      - name: Publish single file
        run: dotnet publish src/Wymcmd/Wymcmd.csproj -c Release -o publish

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "publish/wymcmd.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }
          & $exe help --lang en | Out-Null
          & $exe help --lang tr | Out-Null
          # doctor reports missing sources on a bare runner, which is exit code 3
          & $exe doctor --lang en
          if ($LASTEXITCODE -notin @(0, 3)) { throw "doctor returned $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item publish/wymcmd.exe package/
          Copy-Item README.md, README.tr.md, LICENSE, CHANGELOG.md package/
          Compress-Archive -Path package/* -DestinationPath "wymcmd-$version-win-x64.zip"
          $hash = (Get-FileHash "wymcmd-$version-win-x64.zip" -Algorithm SHA256).Hash
          "$hash  wymcmd-$version-win-x64.zip" | Out-File "wymcmd-$version-win-x64.zip.sha256" -Encoding ascii
          $exeHash = (Get-FileHash publish/wymcmd.exe -Algorithm SHA256).Hash
          "$exeHash  wymcmd.exe" | Out-File "wymcmd.exe.sha256" -Encoding ascii
          Write-Host "zip:  $hash"
          Write-Host "exe:  $exeHash"

      - uses: actions/upload-artifact@v4
        with:
          name: wymcmd
          path: |
            publish/wymcmd.exe
            wymcmd-*.zip
            *.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: false
          files: |
            publish/wymcmd.exe
            wymcmd-*.zip
            *.sha256
