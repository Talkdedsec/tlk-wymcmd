name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check translations
        shell: pwsh
        run: ./scripts/i18n-check.ps1

      - name: Build
        run: dotnet build src/Wymcmd/Wymcmd.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test src/Wymcmd.Tests/Wymcmd.Tests.csproj -c Release --logger "console;verbosity=minimal"
